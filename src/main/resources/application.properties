spring.application.name=RailConnect
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/railconnect?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:railconnect}
spring.datasource.password=${DB_PASSWORD:railconnect_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.thymeleaf.cache=false

server.error.whitelabel.enabled=false
server.error.include-message=never
server.servlet.session.timeout=30m

railconnect.booking.hold-minutes=10
railconnect.notification.enabled=false
