spring.application.name=RailConnect
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/railconnect?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Simple local setup: Hibernate creates/updates tables after the database exists.
spring.flyway.enabled=false
spring.thymeleaf.cache=false

server.error.whitelabel.enabled=false
server.error.include-message=never
server.servlet.session.timeout=30m

railconnect.booking.hold-minutes=10
railconnect.notification.enabled=false
