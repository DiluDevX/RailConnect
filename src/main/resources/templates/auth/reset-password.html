<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Set new password')}"></head>
<body class="auth-page"><header th:replace="~{fragments/layout :: publicHeader('')}"></header><main class="auth-shell">
    <div class="auth-heading"><h1>Choose a new password</h1><p>Your reset link is valid for 30 minutes in this local MVP.</p></div>
    <form class="auth-card" th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="form-errors" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
        <div class="field"><label for="newPassword">New password</label><input id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password" required><span class="field-error" th:errors="*{newPassword}"></span></div>
        <div class="field" style="margin-top:18px"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" required><span class="field-error" th:errors="*{confirmPassword}"></span></div>
        <button class="button button-primary button-block" style="margin-top:24px" type="submit">Save new password</button>
    </form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
