<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-page">
<header th:replace="~{fragments/layout :: publicHeader('')}"></header>
<main class="auth-shell">
    <div class="auth-heading"><h1>Create your account</h1><p>Register as a RailConnect passenger.</p></div>
    <form class="auth-card" th:action="@{/register}" th:object="${registrationForm}" method="post">
        <div class="auth-tabs"><a th:href="@{/login}">Login</a><a class="active" th:href="@{/register}">Register</a></div>
        <div th:if="${#fields.hasGlobalErrors()}" class="form-errors" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
        <div class="field"><label for="fullName">Full name</label><input id="fullName" th:field="*{fullName}" required><span class="field-error" th:errors="*{fullName}"></span></div>
        <div class="field" style="margin-top:16px"><label for="email">Email</label><input id="email" type="email" th:field="*{email}" required><span class="field-error" th:errors="*{email}"></span></div>
        <div class="field" style="margin-top:16px"><label for="phone">Mobile number</label><input id="phone" th:field="*{phone}" placeholder="0771234567" required><span class="field-error" th:errors="*{phone}"></span></div>
        <div class="form-grid" style="margin-top:16px">
            <div class="field"><label for="password">Password</label><input id="password" type="password" th:field="*{password}" required><span class="field-error" th:errors="*{password}"></span></div>
            <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" required></div>
        </div>
        <button class="button button-primary button-block" style="margin-top:24px" type="submit">Create Account</button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
