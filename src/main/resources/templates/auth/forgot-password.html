<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body class="auth-page"><header th:replace="~{fragments/layout :: publicHeader('')}"></header><main class="auth-shell">
    <div class="auth-heading"><h1>Reset your password</h1><p>We will help you regain access to your RailConnect account.</p></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <form class="auth-card" th:action="@{/forgot-password}" method="post">
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" th:value="${email}" autocomplete="email" required></div>
        <button class="button button-primary button-block" style="margin-top:24px" type="submit">Create reset link</button>
        <p class="form-link"><a th:href="@{/login}">Back to sign in</a></p>
        <p class="demo-note" th:if="${demoResetLink}">Local demo reset link: <a th:href="${demoResetLink}" th:text="${demoResetLink}"></a></p>
    </form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
