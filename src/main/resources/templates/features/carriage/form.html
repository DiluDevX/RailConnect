<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${editing ? 'Edit Carriage' : 'Add Carriage'})}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('carriages')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar(${editing ? 'Edit Carriage' : 'Add Carriage'})}"></header><div class="admin-content">
<header class="page-header"><div><h1 th:text="${editing ? 'Edit Carriage' : 'Add Carriage'}"></h1><p>Seats are generated automatically when a carriage is created.</p></div></header>
<form class="form-card" th:action="${editing ? '/admin/carriages/' + carriageId : '/admin/carriages'}" th:object="${carriageForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="form-errors" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
<div class="form-grid"><div class="field"><label for="trainId">Train</label><select id="trainId" th:field="*{trainId}" th:disabled="${editing}" required><option value="">Select train</option><option th:each="train : ${trains}" th:value="${train.id}" th:text="${train.trainNumber + ' - ' + train.trainName}"></option></select><input th:if="${editing}" type="hidden" th:field="*{trainId}"></div><div class="field"><label for="carriageNumber">Carriage number</label><input id="carriageNumber" th:field="*{carriageNumber}" required></div><div class="field"><label for="classType">Class</label><select id="classType" th:field="*{classType}" required><option value="">Select class</option><option th:each="value : ${classes}" th:value="${value}" th:text="${value}"></option></select></div><div class="field"><label for="capacity">Seat capacity</label><input id="capacity" type="number" min="4" max="120" th:field="*{capacity}" th:readonly="${editing}" required></div><div th:if="${editing}" class="field"><label for="status">Status</label><select id="status" th:field="*{status}"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}"></option></select></div></div>
<div class="form-actions"><a class="button button-secondary" th:href="@{/admin/carriages}">Cancel</a><button class="button button-primary" type="submit">Save Carriage</button></div></form>
</div></main></div></body></html>
