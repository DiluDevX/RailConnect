<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Carriage Management')}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('carriages')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar('Carriage Inventory')}"></header><div th:replace="~{fragments/layout :: flash}"></div><div class="admin-content">
<header class="page-header"><div><h1>Carriage Inventory</h1><p>Manage physical rolling stock and structural seat status.</p></div><a class="button button-primary" th:href="@{/admin/carriages/new}">Add Carriage</a></header>
<div class="table-wrap"><table><thead><tr><th>Train</th><th>Carriage</th><th>Class</th><th>Capacity</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:each="carriage : ${carriages}"><td th:text="${carriage.train.trainName}"></td><td><strong th:text="${carriage.carriageNumber}"></strong></td><td th:text="${carriage.classType}"></td><td th:text="${carriage.capacity + ' seats'}"></td><td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(carriage.status)}" th:text="${carriage.status}"></span></td><td class="actions"><a th:href="@{/admin/carriages/{id}/seats(id=${carriage.id})}">Manage Seats</a><a th:href="@{/admin/carriages/{id}/edit(id=${carriage.id})}">Edit</a><form th:action="@{/admin/carriages/{id}/toggle(id=${carriage.id})}" method="post" data-confirm="Change this carriage status? Its seats may stop appearing in future bookings."><button class="link-button danger-text" type="submit">Change Status</button></form></td></tr>
<tr th:if="${#lists.isEmpty(carriages)}"><td colspan="6"><div class="empty-state">No carriages created.</div></td></tr></tbody></table></div>
</div><footer th:replace="~{fragments/layout :: footer}"></footer></main></div></body></html>
