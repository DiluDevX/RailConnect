<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Seat Management')}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('carriages')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar('Seat Management')}"></header><div th:replace="~{fragments/layout :: flash}"></div><div class="admin-content">
<header class="page-header"><div><h1 th:text="${'Physical Seat Status: Carriage ' + carriage.carriageNumber}"></h1><p th:text="${carriage.train.trainName + ' · ' + carriage.classType + ' class'}"></p></div><a class="button button-secondary" th:href="@{/admin/carriages}">Back to Carriages</a></header>
<div class="seat-panel"><p><strong>Important:</strong> this page changes whether a physical seat is usable. Booking availability is calculated separately for every schedule.</p><div class="seat-grid"><form class="seat-choice" th:each="seat : ${seats}" th:classappend="${seat.status.name() != 'ACTIVE'} ? 'unavailable'" th:action="@{/admin/carriages/{carriageId}/seats/{seatId}/toggle(carriageId=${carriage.id},seatId=${seat.id})}" method="post" th:attr="data-confirm=${'Change physical status of seat ' + seat.seatNumber + '?'}"><button type="submit" th:text="${seat.seatNumber}" th:title="${seat.status + ' · ' + seat.seatType}"></button></form></div></div>
</div><footer th:replace="~{fragments/layout :: footer}"></footer></main></div></body></html>
