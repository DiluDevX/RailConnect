<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Schedule Management')}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('schedules')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar('Schedule Management')}"></header><div th:replace="~{fragments/layout :: flash}"></div><div class="admin-content">
<header class="page-header"><div><h1>Schedule Management</h1><p>Plan journeys without overlapping a train's operating time.</p></div><a class="button button-primary" th:href="@{/admin/schedules/new}">Create New Schedule</a></header>
<div class="table-wrap"><table><thead><tr><th>Schedule</th><th>Train</th><th>Route</th><th>Date</th><th>Departure</th><th>Arrival</th><th>Fare</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:each="schedule : ${schedules}"><td><strong th:text="${schedule.scheduleCode}"></strong></td><td th:text="${schedule.train.trainName}"></td><td th:text="${schedule.route.startStation + ' → ' + schedule.route.endStation}"></td><td th:text="${#temporals.format(schedule.travelDate, 'yyyy-MM-dd')}"></td><td th:text="${#temporals.format(schedule.departureTime, 'HH:mm')}"></td><td th:text="${#temporals.format(schedule.arrivalTime, 'HH:mm')}"></td><td th:text="${'LKR ' + schedule.baseFare}"></td><td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(schedule.status)}" th:text="${schedule.status}"></span></td><td class="actions"><a th:href="@{/admin/schedules/{id}/edit(id=${schedule.id})}">Edit</a><form th:if="${schedule.status.name() != 'CANCELLED'}" th:action="@{/admin/schedules/{id}/cancel(id=${schedule.id})}" method="post" data-confirm="Cancel this schedule? Historical bookings will remain, but the journey will no longer be bookable."><button class="link-button danger-text" type="submit">Cancel</button></form></td></tr>
<tr th:if="${#lists.isEmpty(schedules)}"><td colspan="9"><div class="empty-state">No schedules created.</div></td></tr></tbody></table></div>
</div><footer th:replace="~{fragments/layout :: footer}"></footer></main></div></body></html>
