<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${editing ? 'Edit Schedule' : 'Create Schedule'})}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('schedules')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar(${editing ? 'Edit Schedule' : 'Create Schedule'})}"></header><div class="admin-content">
<header class="page-header"><div><h1 th:text="${editing ? 'Edit Schedule' : 'Create Schedule'}"></h1><p>The system validates active trains, routes and timetable conflicts.</p></div></header>
<form class="form-card" th:action="${editing ? '/admin/schedules/' + scheduleId : '/admin/schedules'}" th:object="${scheduleForm}" method="post">
<div th:if="${#fields.hasGlobalErrors()}" class="form-errors" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
<div class="form-grid"><div class="field"><label for="scheduleCode">Schedule code</label><input id="scheduleCode" th:field="*{scheduleCode}" required></div><div class="field"><label for="travelDate">Travel date</label><input id="travelDate" type="date" th:field="*{travelDate}" required></div><div class="field"><label for="trainId">Train</label><select id="trainId" th:field="*{trainId}" required><option value="">Select train</option><option th:each="train : ${trains}" th:value="${train.id}" th:text="${train.trainNumber + ' - ' + train.trainName}"></option></select></div><div class="field"><label for="routeId">Route</label><select id="routeId" th:field="*{routeId}" required><option value="">Select route</option><option th:each="route : ${routes}" th:value="${route.id}" th:text="${route.startStation + ' → ' + route.endStation}"></option></select></div><div class="field"><label for="departureTime">Departure</label><input id="departureTime" type="time" th:field="*{departureTime}" required></div><div class="field"><label for="arrivalTime">Arrival</label><input id="arrivalTime" type="time" th:field="*{arrivalTime}" required></div><div class="field"><label for="baseFare">Base fare (LKR)</label><input id="baseFare" type="number" step="0.01" min="0" th:field="*{baseFare}" required></div><div th:if="${editing}" class="field"><label for="status">Status</label><select id="status" th:field="*{status}"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}"></option></select></div></div>
<div class="form-actions"><a class="button button-secondary" th:href="@{/admin/schedules}">Cancel</a><button class="button button-primary" type="submit">Save Schedule</button></div></form>
</div></main></div></body></html>
