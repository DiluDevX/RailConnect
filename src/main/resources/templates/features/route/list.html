<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Route Management')}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('routes')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar('Route Management')}"></header><div th:replace="~{fragments/layout :: flash}"></div><div class="admin-content">
<header class="page-header"><div><h1>Route Management</h1><p>Maintain station-to-station route definitions.</p></div><div class="toolbar"><form th:action="@{/admin/routes}" method="get"><input name="q" th:value="${query}" placeholder="Search stations..."></form><a class="button button-primary" th:href="@{/admin/routes/new}">Add Route</a></div></header>
<div class="table-wrap"><table><thead><tr><th>Code</th><th>Start station</th><th>End station</th><th>Distance</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:each="route : ${routes}"><td><strong th:text="${route.routeCode}"></strong></td><td th:text="${route.startStation}"></td><td th:text="${route.endStation}"></td><td th:text="${route.distanceKm + ' km'}"></td><td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(route.status)}" th:text="${route.status}"></span></td><td class="actions"><a th:href="@{/admin/routes/{id}/edit(id=${route.id})}">Edit</a><form th:action="@{/admin/routes/{id}/toggle(id=${route.id})}" method="post" th:attr="data-confirm=${route.status.name() == 'INACTIVE' ? 'Reactivate this route?' : 'Deactivate this route? Existing schedules will be preserved.'}"><button class="link-button danger-text" type="submit" th:text="${route.status.name() == 'INACTIVE' ? 'Reactivate' : 'Deactivate'}"></button></form></td></tr>
<tr th:if="${#lists.isEmpty(routes)}"><td colspan="6"><div class="empty-state">No routes found.</div></td></tr></tbody></table></div>
</div><footer th:replace="~{fragments/layout :: footer}"></footer></main></div></body></html>
