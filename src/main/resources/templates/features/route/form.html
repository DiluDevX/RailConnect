<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${editing ? 'Edit Route' : 'Add Route'})}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('routes')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar(${editing ? 'Edit Route' : 'Add Route'})}"></header><div class="admin-content">
<header class="page-header"><div><h1 th:text="${editing ? 'Edit Route' : 'Add Route'}"></h1><p>Define a valid origin, destination and distance.</p></div></header>
<form class="form-card" th:action="${editing ? '/admin/routes/' + routeId : '/admin/routes'}" th:object="${routeForm}" method="post">
<div th:if="${#fields.hasGlobalErrors()}" class="form-errors" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
<div class="form-grid"><div class="field"><label for="routeCode">Route code</label><input id="routeCode" th:field="*{routeCode}" required><span class="field-error" th:errors="*{routeCode}"></span></div><div class="field"><label for="distanceKm">Distance (km)</label><input id="distanceKm" type="number" step="0.1" min="0.1" th:field="*{distanceKm}" required><span class="field-error" th:errors="*{distanceKm}"></span></div><div class="field"><label for="startStation">Start station</label><input id="startStation" th:field="*{startStation}" required></div><div class="field"><label for="endStation">End station</label><input id="endStation" th:field="*{endStation}" required></div></div>
<div th:if="${editing}" class="field" style="margin-top:18px"><label for="status">Status</label><select id="status" th:field="*{status}"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}"></option></select></div>
<div class="form-actions"><a class="button button-secondary" th:href="@{/admin/routes}">Cancel</a><button class="button button-primary" type="submit">Save Route</button></div></form>
</div></main></div></body></html>
