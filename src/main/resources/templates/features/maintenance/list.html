<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Maintenance Management')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/layout :: adminSidebar('maintenance')}"></aside>
    <main class="admin-main">
        <header th:replace="~{fragments/layout :: adminTopbar('Maintenance Management')}"></header>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="admin-content">
            <header class="page-header">
                <div>
                    <h1>Maintenance Management</h1>
                    <p>Schedule, update and keep the history of work done on each train.</p>
                </div>
                <a class="button button-primary" th:href="@{/admin/maintenance/new}">Add maintenance</a>
            </header>
            <form class="toolbar" th:action="@{/admin/maintenance}" method="get" style="margin-bottom:18px;flex-wrap:wrap">
                <select name="trainId" aria-label="Filter by train">
                    <option value="">All trains</option>
                    <option th:each="train : ${trains}" th:value="${train.id}" th:text="${train.trainNumber + ' · ' + train.trainName}" th:selected="${selectedTrainId != null and selectedTrainId == train.id}"></option>
                </select>
                <select name="status" aria-label="Filter by status">
                    <option value="">All statuses</option>
                    <option th:each="value : ${statuses}" th:value="${value}" th:text="${value}" th:selected="${selectedStatus == value}"></option>
                </select>
                <input name="type" th:value="${type}" placeholder="Maintenance type" aria-label="Maintenance type" style="min-width:180px">
                <input type="date" name="date" th:value="${date}" aria-label="Maintenance date" style="min-width:160px">
                <button class="button button-secondary" type="submit">Filter</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Train</th><th>Type</th><th>Date</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="record : ${records}">
                        <td><a th:href="@{/admin/trains/{id}(id=${record.train.id})}" th:text="${record.train.trainNumber + ' · ' + record.train.trainName}">1001</a></td>
                        <td th:text="${record.maintenanceType}">Engine service</td>
                        <td th:text="${#temporals.format(record.maintenanceDate, 'dd MMM yyyy')}">01 Jan 2026</td>
                        <td th:text="${record.description ?: '—'}">Notes</td>
                        <td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(record.status)}" th:text="${record.status}"></span></td>
                        <td class="actions">
                            <a th:href="@{/admin/maintenance/{id}/edit(id=${record.id})}">Edit</a>
                            <form th:if="${record.status.name() != 'COMPLETED' and record.status.name() != 'CANCELLED'}" th:action="@{/admin/maintenance/{id}/cancel(id=${record.id})}" method="post" data-confirm="Cancel this maintenance record?">
                                <button class="link-button" type="submit">Cancel</button>
                            </form>
                            <form th:if="${record.status.name() == 'SCHEDULED'}" th:action="@{/admin/maintenance/{id}/delete(id=${record.id})}" method="post" data-confirm="Delete this scheduled maintenance record?">
                                <button class="link-button danger-text" type="submit">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(records)}"><td colspan="6"><div class="empty-state">No maintenance records found.</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>
</body>
</html>
