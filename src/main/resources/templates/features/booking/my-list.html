<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('My Bookings')}"></head><body>
<header th:replace="~{fragments/layout :: publicHeader('bookings')}"></header><div th:replace="~{fragments/layout :: flash}"></div><main><section class="section"><header class="page-header"><div><h1>My Bookings</h1><p>Review booking history, payments, tickets and cancellations.</p></div><a class="button button-primary" th:href="@{/#journey-search}">Book a Train</a></header>
<div class="list-toolbar"><label for="my-booking-filter"><span class="material-symbols-outlined">search</span><input id="my-booking-filter" data-table-filter="my-bookings-table" placeholder="Find a booking by reference, route or status" aria-label="Filter my bookings"></label><span th:text="${#lists.size(bookings) + ' booking records'}"></span></div>
<div class="table-wrap"><table id="my-bookings-table"><thead><tr><th>Reference</th><th>Journey</th><th>Travel date</th><th>Passenger</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody><tr data-row th:each="booking : ${bookings}"><td><strong th:text="${booking.bookingReference}"></strong></td><td th:text="${booking.schedule.route.startStation + ' → ' + booking.schedule.route.endStation}"></td><td th:text="${#temporals.format(booking.schedule.travelDate, 'dd MMM yyyy')}"></td><td th:text="${booking.passengerName}"></td><td th:text="${'LKR ' + booking.totalAmount}"></td><td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(booking.status)}" th:text="${booking.status}"></span></td><td><a th:href="@{/bookings/{id}(id=${booking.id})}">View Ticket</a></td></tr><tr data-filter-empty hidden><td colspan="7"><div class="empty-state">No bookings match this filter.</div></td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="7"><div class="empty-state">You do not have any bookings yet.</div></td></tr></tbody></table></div>
</section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
