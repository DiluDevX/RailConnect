<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Booking Management')}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('bookings')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar('Booking Management')}"></header><div th:replace="~{fragments/layout :: flash}"></div><div class="admin-content"><header class="page-header"><div><h1>Booking Management</h1><p>Verify tickets and assist passengers without changing trusted totals.</p></div></header>
<div class="list-toolbar"><label for="booking-filter"><span class="material-symbols-outlined">search</span><input id="booking-filter" data-table-filter="bookings-table" placeholder="Filter by reference, passenger, route or status" aria-label="Filter bookings"></label><span th:text="${#lists.size(bookings) + ' booking records'}"></span></div>
<div class="table-wrap"><table id="bookings-table"><thead><tr><th>Reference</th><th>Passenger</th><th>Journey</th><th>Date</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr data-row th:each="booking : ${bookings}"><td><strong th:text="${booking.bookingReference}"></strong></td><td th:text="${booking.passengerName}"></td><td th:text="${booking.schedule.route.startStation + ' → ' + booking.schedule.route.endStation}"></td><td th:text="${#temporals.format(booking.schedule.travelDate, 'dd MMM yyyy')}"></td><td th:text="${'LKR ' + booking.totalAmount}"></td><td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(booking.status)}" th:text="${booking.status}"></span></td><td class="actions"><a th:href="@{/bookings/{id}(id=${booking.id})}">View</a> <a th:href="@{/admin/bookings/{id}/edit(id=${booking.id})}">Edit</a><form th:action="@{/admin/bookings/{id}/delete(id=${booking.id})}" method="post" style="display:inline" data-confirm="Delete this booking and release its seats?"><button class="link-button danger-text" type="submit">Delete</button></form></td></tr><tr data-filter-empty hidden><td colspan="7"><div class="empty-state">No bookings match this filter.</div></td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="7"><div class="empty-state">No bookings recorded.</div></td></tr></tbody></table></div>
</div><footer th:replace="~{fragments/layout :: footer}"></footer></main></div></body></html>
