<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Edit Booking')}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('bookings')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar('Edit Booking')}"></header><div th:replace="~{fragments/layout :: flash}"></div><div class="admin-content"><header class="page-header"><div><h1 th:text="${'Edit ' + booking.bookingReference}"></h1><p>Update passenger details without changing seats, fare or payment history.</p></div><a class="button button-secondary" th:href="@{/admin/bookings}">Back to bookings</a></header>
<section class="card"><div class="card-body"><form th:action="@{/admin/bookings/{id}/edit(id=${booking.id})}" th:object="${bookingForm}" method="post"><div class="form-grid"><div class="field"><label for="passengerName">Passenger name</label><input id="passengerName" th:field="*{passengerName}" required><p class="field-error" th:if="${#fields.hasErrors('passengerName')}" th:errors="*{passengerName}"></p></div><div class="field"><label for="contactEmail">Contact email</label><input id="contactEmail" type="email" th:field="*{contactEmail}"><p class="field-error" th:if="${#fields.hasErrors('contactEmail')}" th:errors="*{contactEmail}"></p></div><div class="field"><label for="contactPhone">Contact phone</label><input id="contactPhone" th:field="*{contactPhone}"><p class="field-error" th:if="${#fields.hasErrors('contactPhone')}" th:errors="*{contactPhone}"></p></div></div><div class="form-actions"><a class="button button-secondary" th:href="@{/admin/bookings}">Cancel</a><button class="button button-primary" type="submit">Save changes</button></div></form></div></section></div><footer th:replace="~{fragments/layout :: footer}"></footer></main></div></body></html>
