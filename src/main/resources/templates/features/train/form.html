<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${editing ? 'Edit Train' : 'Add Train'})}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('trains')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar(${editing ? 'Edit Train' : 'Add Train'})}"></header><div class="admin-content">
<header class="page-header"><div><h1 th:text="${editing ? 'Edit Train' : 'Add Train'}"></h1><p>Train capacity is calculated from its carriages.</p></div></header>
<form class="form-card" th:action="${editing ? '/admin/trains/' + trainId : '/admin/trains'}" th:object="${trainForm}" method="post">
<div th:if="${#fields.hasGlobalErrors()}" class="form-errors" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
<div class="form-grid"><div class="field"><label for="trainNumber">Train number</label><input id="trainNumber" th:field="*{trainNumber}" required><span class="field-error" th:errors="*{trainNumber}"></span></div><div class="field"><label for="trainName">Train name</label><input id="trainName" th:field="*{trainName}" required><span class="field-error" th:errors="*{trainName}"></span></div></div>
<div class="field" style="margin-top:18px"><label for="description">Description</label><textarea id="description" th:field="*{description}"></textarea></div>
<div class="fare-editor"><div><p class="eyebrow">Passenger pricing</p><h2>Class fares for this train</h2><p>These prices are used by seat selection. Update them here instead of editing each booking.</p></div><div class="form-grid"><div class="field"><label for="firstClassFare">First class fare (LKR)</label><input id="firstClassFare" type="number" min="0" step="0.01" th:field="*{firstClassFare}" required><span class="field-error" th:errors="*{firstClassFare}"></span></div><div class="field"><label for="secondClassFare">Second class fare (LKR)</label><input id="secondClassFare" type="number" min="0" step="0.01" th:field="*{secondClassFare}" required><span class="field-error" th:errors="*{secondClassFare}"></span></div><div class="field"><label for="thirdClassFare">Third class fare (LKR)</label><input id="thirdClassFare" type="number" min="0" step="0.01" th:field="*{thirdClassFare}" required><span class="field-error" th:errors="*{thirdClassFare}"></span></div></div></div>
<div th:if="${editing}" class="field" style="margin-top:18px"><label for="status">Status</label><select id="status" th:field="*{status}"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}"></option></select></div>
<div class="form-actions"><a class="button button-secondary" th:href="@{/admin/trains}">Cancel</a><button class="button button-primary" type="submit">Save Train</button></div></form>
</div></main></div></body></html>
