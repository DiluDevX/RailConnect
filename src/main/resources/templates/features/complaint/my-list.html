<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('My Complaints')}"></head><body>
<header th:replace="~{fragments/layout :: publicHeader('complaints')}"></header><div th:replace="~{fragments/layout :: flash}"></div><main><section class="section"><header class="page-header"><div><h1>My Complaints</h1><p>Submit a concern and follow its response status.</p></div><a class="button button-primary" th:href="@{/complaints/new}">New Complaint</a></header>
<div class="list-toolbar"><label for="my-complaint-filter"><span class="material-symbols-outlined">search</span><input id="my-complaint-filter" data-table-filter="my-complaints-table" placeholder="Find a complaint by reference, subject or status" aria-label="Filter my complaints"></label><span th:text="${#lists.size(complaints) + ' complaint records'}"></span></div>
<div class="table-wrap"><table id="my-complaints-table"><thead><tr><th>Reference</th><th>Type</th><th>Subject</th><th>Booking</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody><tr data-row th:each="complaint : ${complaints}"><td><strong th:text="${complaint.complaintReference}"></strong></td><td th:text="${complaint.complaintType}"></td><td th:text="${complaint.subject}"></td><td th:text="${complaint.booking == null ? 'General' : complaint.booking.bookingReference}"></td><td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(complaint.status)}" th:text="${complaint.status}"></span></td><td th:text="${#temporals.format(complaint.createdAt, 'dd MMM yyyy')}"></td><td><a th:href="@{/complaints/{id}(id=${complaint.id})}">View Details</a></td></tr><tr data-filter-empty hidden><td colspan="7"><div class="empty-state">No complaints match this filter.</div></td></tr><tr th:if="${#lists.isEmpty(complaints)}"><td colspan="7"><div class="empty-state">You have not submitted a complaint.</div></td></tr></tbody></table></div>
</section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
