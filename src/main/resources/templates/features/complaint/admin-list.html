<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Complaint Management')}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('complaints')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar('Complaint Management')}"></header><div th:replace="~{fragments/layout :: flash}"></div><div class="admin-content"><header class="page-header"><div><h1>Complaint Management</h1><p>Review and resolve passenger support requests.</p></div></header>
<div class="list-toolbar"><label for="complaint-filter"><span class="material-symbols-outlined">search</span><input id="complaint-filter" data-table-filter="complaints-table" placeholder="Filter by reference, passenger, booking or status" aria-label="Filter complaints"></label><span th:text="${#lists.size(complaints) + ' complaint records'}"></span></div>
<div class="table-wrap"><table id="complaints-table"><thead><tr><th>Reference</th><th>Passenger</th><th>Booking</th><th>Type</th><th>Subject</th><th>Status</th><th>Action</th></tr></thead><tbody><tr data-row th:each="complaint : ${complaints}"><td><strong th:text="${complaint.complaintReference}"></strong></td><td th:text="${complaint.user.fullName}"></td><td th:text="${complaint.booking == null ? 'General' : complaint.booking.bookingReference}"></td><td th:text="${complaint.complaintType}"></td><td th:text="${complaint.subject}"></td><td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(complaint.status)}" th:text="${complaint.status}"></span></td><td><a th:href="@{/admin/complaints/{id}(id=${complaint.id})}">View / Respond</a></td></tr><tr data-filter-empty hidden><td colspan="7"><div class="empty-state">No complaints match this filter.</div></td></tr><tr th:if="${#lists.isEmpty(complaints)}"><td colspan="7"><div class="empty-state">No complaints recorded.</div></td></tr></tbody></table></div>
</div><footer th:replace="~{fragments/layout :: footer}"></footer></main></div></body></html>
