<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Respond to Complaint')}"></head><body>
<div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('complaints')}"></aside><main class="admin-main"><header th:replace="~{fragments/layout :: adminTopbar('Complaint Details')}"></header><div th:replace="~{fragments/layout :: flash}"></div><div class="admin-content"><header class="page-header"><div><h1 th:text="${complaint.complaintReference}"></h1><p th:text="${complaint.subject}"></p></div><span class="status" th:classappend="${'status-' + #strings.toLowerCase(complaint.status)}" th:text="${complaint.status}"></span></header>
<div class="booking-layout"><section class="card"><div class="card-body"><dl class="detail-list"><dt>Passenger</dt><dd th:text="${complaint.user.fullName + ' · ' + complaint.user.email}"></dd><dt>Type</dt><dd th:text="${complaint.complaintType}"></dd><dt>Booking</dt><dd th:text="${complaint.booking == null ? 'General complaint' : complaint.booking.bookingReference}"></dd><dt>Description</dt><dd th:text="${complaint.description}"></dd></dl></div></section><form class="booking-summary" th:action="@{/admin/complaints/{id}/respond(id=${complaint.id})}" method="post"><h2>Staff Response</h2><div class="field"><label for="status">Status</label><select id="status" name="status"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}" th:selected="${value == complaint.status}"></option></select></div><div class="field" style="margin-top:16px"><label for="response">Response</label><textarea id="response" name="response" required th:text="${complaint.adminResponse}"></textarea></div><button class="button button-primary button-block" style="margin-top:20px" type="submit">Save Response</button></form></div>
</div><footer th:replace="~{fragments/layout :: footer}"></footer></main></div></body></html>
