<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${editing ? 'Edit Complaint' : 'Submit Complaint'})}"></head><body>
<header th:replace="~{fragments/layout :: publicHeader('complaints')}"></header><main><section class="section"><header class="page-header"><div><h1 th:text="${editing ? 'Edit Complaint' : 'Submit Complaint'}"></h1><p>Provide enough detail for railway staff to understand the issue.</p></div></header>
<form class="form-card" th:action="${editing ? '/complaints/' + complaintId : '/complaints'}" th:object="${complaintForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="form-errors" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
<div class="form-grid"><div class="field"><label for="complaintType">Complaint type</label><select id="complaintType" th:field="*{complaintType}" required><option value="">Select type</option><option th:each="value : ${types}" th:value="${value}" th:text="${value}"></option></select><span class="field-error" th:errors="*{complaintType}"></span></div><div class="field"><label for="bookingId">Related booking (optional)</label><select id="bookingId" th:field="*{bookingId}"><option value="">General complaint</option><option th:each="booking : ${bookings}" th:value="${booking.id}" th:text="${booking.bookingReference + ' · ' + booking.schedule.route.startStation + ' → ' + booking.schedule.route.endStation}"></option></select></div></div>
<div class="field" style="margin-top:18px"><label for="subject">Subject</label><input id="subject" th:field="*{subject}" required><span class="field-error" th:errors="*{subject}"></span></div><div class="field" style="margin-top:18px"><label for="description">Description</label><textarea id="description" th:field="*{description}" required></textarea><span class="field-error" th:errors="*{description}"></span></div>
<div class="form-actions"><a class="button button-secondary" th:href="@{/my-complaints}">Cancel</a><button class="button button-primary" type="submit">Save Complaint</button></div></form>
</section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
