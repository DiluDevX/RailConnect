<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Complaint Details')}"></head><body>
<header th:replace="~{fragments/layout :: publicHeader('complaints')}"></header><div th:replace="~{fragments/layout :: flash}"></div><main><section class="section"><header class="page-header"><div><h1 th:text="${complaint.complaintReference}"></h1><p th:text="${complaint.subject}"></p></div><span class="status" th:classappend="${'status-' + #strings.toLowerCase(complaint.status)}" th:text="${complaint.status}"></span></header>
<div class="booking-layout"><section class="card"><div class="card-body"><dl class="detail-list"><dt>Type</dt><dd th:text="${complaint.complaintType}"></dd><dt>Related booking</dt><dd th:text="${complaint.booking == null ? 'None' : complaint.booking.bookingReference}"></dd><dt>Description</dt><dd th:text="${complaint.description}"></dd><dt>Staff response</dt><dd th:text="${complaint.adminResponse ?: 'No response has been added yet.'}"></dd></dl></div></section><aside class="booking-summary"><h2>Actions</h2><a th:if="${complaint.status.name() == 'OPEN'}" class="button button-secondary button-block" th:href="@{/complaints/{id}/edit(id=${complaint.id})}">Edit Complaint</a><form th:if="${complaint.status.name() == 'OPEN'}" th:action="@{/complaints/{id}/withdraw(id=${complaint.id})}" method="post" style="margin-top:12px" data-confirm="Withdraw this complaint? It will remain in history but cannot be edited afterward."><button class="button button-danger button-block" type="submit">Withdraw Complaint</button></form><a class="button button-primary button-block" style="margin-top:12px" th:href="@{/my-complaints}">Back to My Complaints</a></aside></div>
</section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
